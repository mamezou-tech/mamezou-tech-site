<text class="t1" x="90" y="80" font-size="16" font-weight="bold" text-anchor="middle">Web UI</text>
<text class="t1" x="90" y="104" font-size="13" text-anchor="middle">プレゼンテーション</text>
<rect class="srv" x="307" y="48" width="140" height="74" rx="8"/>
<text class="t1" x="377" y="80" font-size="16" font-weight="bold" text-anchor="middle">サーバー</text>
<text class="t1" x="377" y="104" font-size="13" text-anchor="middle">中継</text>
<rect class="mod" x="594" y="48" width="140" height="74" rx="8"/>
