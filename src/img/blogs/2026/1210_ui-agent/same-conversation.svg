<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Web UIで聞いたことがターミナルのClaude Codeの会話に入る図。Web UIで10行目について聞き、AIが答えたあと、Web UIから「直して」とだけ頼むと、同じ会話なのでAIはその行を直す">
<title>Web UIで聞いたことがターミナルのClaude Codeの会話に入る図。Web UIで10行目について聞き、AIが答えたあと、Web UIから「直して」とだけ頼むと、同じ会話なのでAIはその行を直す</title>
<style>
text { font-family: 'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif; }
.mono { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
.bg { fill: #ffffff; } .t1 { fill: #1f2328; } .t2 { fill: #57606a; }
.ui { fill: #ddf4ff; stroke: #2a78d6; } .cc { fill: #fff8c5; stroke: #9a6700; }
.code { fill: #ffffff; stroke: #8c959f; } .hl { fill: #fff1a8; }
.bub { fill: #ffffff; stroke: #2a78d6; }
.ar { stroke: #2a78d6; fill: none; stroke-width: 2.5; } .ah { fill: #2a78d6; }
.tag { fill: #2a78d6; } .tagt { fill: #ffffff; }
</style>
<defs>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="290"/>

<!-- Web UI -->
<rect class="ui" x="20" y="20" width="310" height="250" rx="8"/>
<text class="t1" x="40" y="50" font-size="16">Web UI</text>
<rect class="code" x="40" y="66" width="270" height="74" rx="4"/>
<text class="t2 mono" x="50" y="88" font-size="12">9   // 一時的な失敗だけを再試行する</text>
<rect class="hl" x="41" y="96" width="268" height="20"/>
<text class="t1 mono" x="50" y="111" font-size="12">10  const RETRYABLE = …429…</text>
<text class="t2 mono" x="50" y="132" font-size="12">11</text>
<rect class="bub" x="40" y="156" width="270" height="44" rx="6"/>
<text class="t1" x="52" y="183" font-size="14">429のとき、Retry-Afterを見ますか？</text>
<rect class="bub" x="40" y="212" width="90" height="40" rx="6"/>
<text class="t1" x="56" y="237" font-size="14">直して</text>

<!-- 矢印 -->
<line class="ar" x1="334" y1="145" x2="396" y2="145" marker-end="url(#a1)" marker-start="url(#a1)"/>

<!-- ターミナルの会話 -->
<rect class="cc" x="400" y="20" width="480" height="250" rx="8"/>
<text class="t1" x="420" y="50" font-size="16">ターミナルのClaude Codeの会話</text>
<rect class="tag" x="420" y="72" width="64" height="22" rx="4"/>
<text class="tagt" x="452" y="88" font-size="12" text-anchor="middle">Web UI</text>
<text class="t1" x="494" y="88" font-size="14">10行目：429のとき、Retry-Afterを見ますか？</text>
<text class="t1" x="420" y="124" font-size="14">AI：見ずに再試行します（10行目）</text>
<rect class="tag" x="420" y="146" width="64" height="22" rx="4"/>
<text class="tagt" x="452" y="162" font-size="12" text-anchor="middle">Web UI</text>
<text class="t1" x="494" y="162" font-size="14">直して</text>
<text class="t1" x="420" y="198" font-size="14">AI：Retry-Afterを見るようにretry.tsを直しました</text>
<text class="t2" x="420" y="246" font-size="13">同じ会話なので「直して」だけで何の話かが通じる</text>
</svg>
