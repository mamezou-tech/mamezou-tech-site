<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" font-size="14" fill="#1f2328">
<style>
@media (prefers-color-scheme: dark) {
  [fill="#0a3069"] { fill: #cae8ff }
  [fill="#1a7f37"] { fill: #3fb950 }
  [fill="#1f2328"] { fill: #e6edf3 }
  [fill="#512a97"] { fill: #d2a8ff }
  [fill="#57606a"] { fill: #9198a1 }
  [fill="#ddf4ff"] { fill: #12263f }
  [fill="#fbefff"] { fill: #221a33 }
  [fill="#ffffff"] { fill: #0d1117 }
  [stroke="#0969da"] { stroke: #4493f8 }
  [stroke="#1a7f37"] { stroke: #3fb950 }
  [stroke="#57606a"] { stroke: #9198a1 }
  [stroke="#8250df"] { stroke: #ab7df8 }
  text[fill="#ffffff"], tspan[fill="#ffffff"] { fill: #ffffff }
}
</style>
<rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="48" y="25" width="104" height="22" fill="#ddf4ff" rx="11" stroke="#0969da" stroke-width="1.5"/>
<text x="100" y="40.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a3069">AIエージェント</text>
<rect x="20" y="56" width="160" height="60" fill="#ddf4ff" rx="6" stroke="#0969da" stroke-width="1.5"/>
<text x="100" y="82" text-anchor="middle" font-size="13">チェックのコマンドを</text>
<text x="100" y="100" text-anchor="middle" font-size="13">提案する</text>
<rect x="292" y="25" width="36" height="22" fill="#fbefff" rx="11" stroke="#8250df" stroke-width="1.5"/>
<text x="310" y="40.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#512a97">人</text>
<rect x="230" y="56" width="160" height="60" fill="#fbefff" rx="6" stroke="#8250df" stroke-width="1.5"/>
<text x="310" y="82" text-anchor="middle" font-size="13">コマンドを</text>
<text x="310" y="100" text-anchor="middle" font-size="13">承認する</text>
<rect x="490" y="25" width="60" height="22" fill="#1a7f37" rx="11" stroke="#1a7f37" stroke-width="1.5"/>
<text x="520" y="40.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ツール</text>
<rect x="440" y="56" width="160" height="60" fill="#ffffff" rx="6" stroke="#1a7f37" stroke-width="1.5"/>
<text x="520" y="82" text-anchor="middle" font-size="13">作る単位ごとに</text>
<text x="520" y="100" text-anchor="middle" font-size="13">コマンドを流す</text>
<line x1="180" y1="86" x2="228" y2="86" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390" y1="86" x2="438" y2="86" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="520" y1="116" x2="520" y2="194" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="508" y="161" text-anchor="end" font-size="12" fill="#57606a">終了コードが0のときだけ</text>
<rect x="440" y="196" width="160" height="44" fill="#ffffff" rx="6" stroke="#1a7f37" stroke-width="1.5"/>
<text x="520" y="223" text-anchor="middle" font-weight="bold">単位を通す</text>
<rect x="20" y="265" width="60" height="22" fill="#1a7f37" rx="11" stroke="#1a7f37" stroke-width="1.5"/>
<text x="50" y="280.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ツール</text>
<text x="86" y="280" font-size="12">ツールのプログラムがする</text>
<rect x="254" y="265" width="104" height="22" fill="#ddf4ff" rx="11" stroke="#0969da" stroke-width="1.5"/>
<text x="306" y="280.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a3069">AIエージェント</text>
<text x="364" y="280" font-size="12">プロンプトに沿ってする</text>
<rect x="520" y="265" width="36" height="22" fill="#fbefff" rx="11" stroke="#8250df" stroke-width="1.5"/>
<text x="538" y="280.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#512a97">人</text>
<text x="562" y="280" font-size="12">人が決める</text>
</svg>
