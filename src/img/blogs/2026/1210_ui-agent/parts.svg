<text class="t1" x="664" y="104" font-size="13" text-anchor="middle">コントローラ</text>
<rect class="sk" x="881" y="48" width="140" height="74" rx="8"/>
<text class="t2" x="951" y="66" font-size="11" text-anchor="middle">Claude Code</text>
<text class="t1" x="951" y="88" font-size="16" font-weight="bold" text-anchor="middle">AIとスキル</text>
<text class="t1" x="951" y="110" font-size="13" text-anchor="middle">サービス（ロジック）</text>

<line class="ar" x1="164" y1="85" x2="303" y2="85" marker-end="url(#p1)"/>
<text class="t1" x="233" y="60" font-size="12" text-anchor="middle">JSON</text>
<text class="t2" x="233" y="76" font-size="12" text-anchor="middle">（依頼の名前と中身）</text>
<line class="ar" x1="451" y1="85" x2="590" y2="85" marker-end="url(#p1)"/>
<text class="t1" x="520" y="76" font-size="12" text-anchor="middle">そのまま</text>
<line class="ar" x1="738" y1="85" x2="877" y2="85" marker-end="url(#p1)"/>
<text class="t1" x="807" y="76" font-size="12" text-anchor="middle">スラッシュコマンド</text>

<text class="t2" x="90" y="146" font-size="13" text-anchor="middle">依頼の名前と中身を送る</text>
<text class="t2" x="377" y="146" font-size="13" text-anchor="middle">中身を見ずに運ぶ</text>
<text class="t2" x="664" y="146" font-size="13" text-anchor="middle">依頼の名前を</text>
<text class="t2" x="664" y="164" font-size="13" text-anchor="middle">スキルに振り分ける</text>
<text class="t2" x="951" y="146" font-size="13" text-anchor="middle">AIへの指示（プロンプト）</text>
