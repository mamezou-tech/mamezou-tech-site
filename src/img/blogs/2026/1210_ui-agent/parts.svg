<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 324" width="1040" height="324" role="img" aria-label="部品の役割と相互作用と、試作での実物の図。上の段は役割と相互作用。Web UIはプレゼンテーションとして依頼の名前と中身をJSONで送る。サーバーは中継として中身を見ずにそのまま運ぶ。modはコントローラとして依頼の名前をスキルに振り分け、スラッシュコマンドにする。Claude CodeのAIとスキルはサービス（ロジック）で、AIへの指示（プロンプト）はスキルが持つ。下の段は試作での実物。「AIに聞く」ボタンが{&quot;command&quot;: &quot;answer&quot;, &quot;params&quot;: {…}}を送り、サーバーは/t/&lt;トークン&gt;/api/commandsで受けて/bridge/pollで渡し、modはanswerを/pr-review:answerにして、スキルのanswer/SKILL.mdが動く">
<title>部品の役割と相互作用と、試作での実物の図。上の段は役割と相互作用。Web UIはプレゼンテーションとして依頼の名前と中身をJSONで送る。サーバーは中継として中身を見ずにそのまま運ぶ。modはコントローラとして依頼の名前をスキルに振り分け、スラッシュコマンドにする。Claude CodeのAIとスキルはサービス（ロジック）で、AIへの指示（プロンプト）はスキルが持つ。下の段は試作での実物。「AIに聞く」ボタンが{"command": "answer", "params": {…}}を送り、サーバーは/t/&lt;トークン&gt;/api/commandsで受けて/bridge/pollで渡し、modはanswerを/pr-review:answerにして、スキルのanswer/SKILL.mdが動く</title>
<style>
text { font-family: 'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif; }
.mono { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
.bg { fill: #ffffff; } .t1 { fill: #1f2328; } .t2 { fill: #57606a; }
.ui { fill: #ddf4ff; stroke: #2a78d6; } .srv { fill: #f6f8fa; stroke: #8c959f; stroke-dasharray: 5 4; }
.mod { fill: #ffffff; stroke: #2a78d6; stroke-width: 2.5; } .sk { fill: #fff8c5; stroke: #9a6700; stroke-width: 2.5; }
.ar { stroke: #2a78d6; fill: none; stroke-width: 2; } .ah { fill: #2a78d6; }
.go { fill: #2a78d6; } .ret { fill: #1a7f37; }
.sep { stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 4 4; }
</style>
<defs>
<marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1040" height="324"/>

<!-- 上の段：役割と相互作用 -->
<text class="go" x="20" y="24" font-size="14" font-weight="bold">役割と相互作用</text>

