<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 506" width="820" height="506" role="img" aria-label="アプリケーションは公開APIを通してフレームワークと共通コンポーネントだけを使う。許可していないAPIを直に使うと使用APIチェックで止める。設定値はフレームワークの側に置く">
<title>アプリケーションは公開APIを通してフレームワークと共通コンポーネントだけを使う。許可していないAPIを直に使うと使用APIチェックで止める。設定値はフレームワークの側に置く</title>
<style>
text { font-family: 'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif; }
.bg { fill: #ffffff; }
.t1 { fill: #1f2328; }
.t2 { fill: #57606a; }
.grid { stroke: #d0d7de; }
.s1 { fill: #2a78d6; } .s1l { fill: #86b6ef; }
.c1 { fill: #2a78d6; } .c2 { fill: #eb6834; } .c3 { fill: #1baf7a; } .c4 { fill: #eda100; } .c0 { fill: #8c959f; }
.b1 { fill: #2a78d6; } .b2 { fill: #eb6834; } .b3 { fill: #1baf7a; } .b4 { fill: #eda100; } .b0 { fill: #8c959f; }
.box { fill: #f6f8fa; stroke: #8c959f; }
.app { fill: #ddf4ff; stroke: #2a78d6; }
.fw { fill: #dafbe1; stroke: #1a7f37; }
.ng { fill: #ffebe9; stroke: #cf222e; }
.ngt { fill: #cf222e; }
.arrow { stroke: #57606a; fill: none; }
.arrowng { stroke: #cf222e; fill: none; }
.ah { fill: #57606a; } .ahng { fill: #cf222e; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #0d1117; }
  .t1 { fill: #e6edf3; }
  .t2 { fill: #9198a1; }
  .grid { stroke: #30363d; }
  .s1 { fill: #3987e5; } .s1l { fill: #1c5cab; }
  .c1 { fill: #3987e5; } .c2 { fill: #d95926; } .c3 { fill: #199e70; } .c4 { fill: #c98500; } .c0 { fill: #6e7681; }
  .b1 { fill: #3987e5; } .b2 { fill: #d95926; } .b3 { fill: #199e70; } .b4 { fill: #c98500; } .b0 { fill: #6e7681; }
  .box { fill: #161b22; stroke: #6e7681; }
  .app { fill: #12263f; stroke: #3987e5; }
  .fw { fill: #12261e; stroke: #3fb950; }
  .ng { fill: #3c1618; stroke: #f85149; }
  .ngt { fill: #f85149; }
  .arrow { stroke: #9198a1; } .ah { fill: #9198a1; }
  .arrowng { stroke: #f85149; } .ahng { fill: #f85149; }
}
</style>
<rect class="bg" width="820" height="506"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahng" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text x="12" y="20" class="t1" font-size="15" text-anchor="start" font-weight="bold">フレームワークと共通コンポーネントに作り込み、使用APIチェックで守らせる</text>
<rect class="app" x="12" y="40" width="300" height="360" rx="8" stroke-width="1.5"/>
<text x="28" y="66" class="t1" font-size="15" text-anchor="start" font-weight="bold">アプリケーション</text>
<text x="28" y="90" class="t2" font-size="13" text-anchor="start">業務ロジックと、権限表のような</text>
<text x="28" y="110" class="t2" font-size="13" text-anchor="start">業務の決めごとだけを書く</text>
<text x="28" y="134" class="t2" font-size="13" text-anchor="start">→ ユニットテストとレビューで見る</text>
<rect class="box" x="352" y="40" width="40" height="360" rx="6" stroke-width="1"/>
<text x="372" y="210" class="t1" font-size="14" text-anchor="middle" font-weight="bold">公開</text>
<text x="372" y="230" class="t1" font-size="14" text-anchor="middle" font-weight="bold">API</text>
<rect class="fw" x="432" y="40" width="376" height="360" rx="8" stroke-width="1.5"/>
<text x="448" y="66" class="t1" font-size="15" text-anchor="start" font-weight="bold">フレームワークと共通コンポーネント</text>
<text x="448" y="88" class="t2" font-size="13" text-anchor="start">作るチームが一度テストしてレビューする</text>
<rect class="bg" x="448" y="104" width="344" height="38" rx="5" stroke="#8c959f" stroke-width="1"/>
<text x="458" y="120" class="t1" font-size="13" text-anchor="start">HTTPクライアント</text>
<text x="458" y="136" class="t2" font-size="11.5" text-anchor="start">（タイムアウト、遮断、リトライ）</text>
<rect class="bg" x="448" y="150" width="344" height="38" rx="5" stroke="#8c959f" stroke-width="1"/>
<text x="458" y="166" class="t1" font-size="13" text-anchor="start">認証と認可</text>
<text x="458" y="182" class="t2" font-size="11.5" text-anchor="start">（トークンの検証、セッション、回数制限、権限表で判定）</text>
<rect class="bg" x="448" y="196" width="344" height="38" rx="5" stroke="#8c959f" stroke-width="1"/>
<text x="458" y="220" class="t1" font-size="13" text-anchor="start">データアクセス（接続のプール、トランザクション）</text>
<rect class="bg" x="448" y="242" width="344" height="38" rx="5" stroke="#8c959f" stroke-width="1"/>
<text x="458" y="266" class="t1" font-size="13" text-anchor="start">重複を止める（同じリクエストは1回分）</text>
<rect class="bg" x="448" y="288" width="344" height="38" rx="5" stroke="#8c959f" stroke-width="1"/>
<text x="458" y="304" class="t1" font-size="13" text-anchor="start">終わり方と例外</text>
<text x="458" y="320" class="t2" font-size="11.5" text-anchor="start">（処理中の仕事を終える、拒否に倒す）</text>
<line class="arrow" x1="312" y1="150" x2="350" y2="150" stroke-width="2" marker-end="url(#a)"/>
<line class="arrow" x1="392" y1="150" x2="430" y2="150" stroke-width="2" marker-end="url(#a)"/>
<line class="arrow" x1="312" y1="200" x2="350" y2="200" stroke-width="2" marker-end="url(#a)"/>
<line class="arrow" x1="392" y1="200" x2="430" y2="200" stroke-width="2" marker-end="url(#a)"/>
<rect class="box" x="448" y="336" width="344" height="52" rx="5" stroke-width="1"/>
<text x="458" y="356" class="t1" font-size="13" text-anchor="start">設定値（設計書の値と照らす）</text>
<text x="458" y="377" class="t2" font-size="11.5" text-anchor="start">（タイムアウトの秒数、セッションの時間、回数制限）</text>
<rect class="ng" x="432" y="432" width="376" height="62" rx="8" stroke-width="1.5"/>
<text x="448" y="456" class="t1" font-size="14" text-anchor="start" font-weight="bold">許可していないAPI</text>
<text x="448" y="478" class="t2" font-size="12.5" text-anchor="start">Thread、DriverManager、自前のHTTPクライアントなど</text>
<path class="arrowng" d="M200,400 V472 H428" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#n)"/>
<text x="214" y="440" class="ngt" font-size="13" text-anchor="start" font-weight="bold">使用APIチェックで止める</text>
<text x="214" y="457" class="t2" font-size="12" text-anchor="start">（許可する一覧にない呼び出し）</text>
</svg>
