<text class="mono t1" x="664" y="282" font-size="12" text-anchor="middle">/pr-review:answer</text>
<rect class="sk" x="881" y="228" width="140" height="80" rx="8"/>
<text class="mono t1" x="951" y="273" font-size="12" text-anchor="middle">answer/SKILL.md</text>

<line class="ar" x1="164" y1="268" x2="303" y2="268" marker-end="url(#p1)"/>
<text class="mono t1" x="233" y="244" font-size="11" text-anchor="middle">{"command": "answer",</text>
<text class="mono t1" x="233" y="259" font-size="11" text-anchor="middle">"params": {…}}</text>
<line class="ar" x1="451" y1="268" x2="590" y2="268" marker-end="url(#p1)"/>
