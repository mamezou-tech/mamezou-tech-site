<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="今の会話には人がターミナルで頼んだ作業のターンと、Web UIの依頼のターンが順に並ぶ。Web UIはスレッドのidを入れた依頼を送り、modは人が頼んだ作業のターンが終わってから、その依頼を/pr-review:answerとして今の会話に入れる。modはターンの始まりの文に入ったスレッドのidで、そのターンがどの依頼のものかを決め、ターンが終わるとその答えを同じスレッドに返す。人が頼んだ作業のターンの答えはWeb UIに返さない。間にあるサーバーは図では省いている">
<title>今の会話には人がターミナルで頼んだ作業のターンと、Web UIの依頼のターンが順に並ぶ。Web UIはスレッドのidを入れた依頼を送り、modは人が頼んだ作業のターンが終わってから、その依頼を/pr-review:answerとして今の会話に入れる。modはターンの始まりの文に入ったスレッドのidで、そのターンがどの依頼のものかを決め、ターンが終わるとその答えを同じスレッドに返す。人が頼んだ作業のターンの答えはWeb UIに返さない。間にあるサーバーは図では省いている</title>
<style>
text { font-family: 'Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif; }
.mono { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
.bg { fill: #ffffff; } .t1 { fill: #1f2328; } .t2 { fill: #57606a; }
.ui { fill: #ddf4ff; stroke: #2a78d6; } .human { fill: #eaeef2; stroke: #8c959f; } .turn { fill: #ddf4ff; stroke: #2a78d6; stroke-width: 2; }
.mod { fill: #ffffff; stroke: #2a78d6; stroke-width: 2; }
.ar { stroke: #2a78d6; fill: none; stroke-width: 2; } .ah { fill: #2a78d6; }
.back { stroke: #1a7f37; fill: none; stroke-width: 2; } .bh { fill: #1a7f37; }
.no { stroke: #8c959f; fill: none; stroke-width: 1.5; stroke-dasharray: 4 4; }
.id { fill: #fff1a8; stroke: #d4a72c; }
</style>
<defs>
<marker id="t1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="t2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="bh"/></marker>
<marker id="t3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="330"/>

<text class="t2" x="20" y="44" font-size="12">Web UI</text>
<text class="t2" x="20" y="152" font-size="12">mod</text>
<text class="t2" x="20" y="270" font-size="12">今の会話</text>

<!-- Web UIのスレッド -->
<rect class="ui" x="90" y="20" width="230" height="40" rx="6"/>
<text class="t1" x="104" y="45" font-size="13">スレッド</text>
<rect class="id" x="166" y="30" width="40" height="22" rx="4"/><text class="mono t1" x="186" y="46" font-size="12" text-anchor="middle">t1</text>
<text class="t1" x="214" y="45" font-size="13">で質問する</text>
<rect class="ui" x="600" y="20" width="230" height="40" rx="6"/>
<text class="t1" x="614" y="45" font-size="13">スレッド</text>
<rect class="id" x="676" y="30" width="40" height="22" rx="4"/><text class="mono t1" x="696" y="46" font-size="12" text-anchor="middle">t1</text>
<text class="t1" x="724" y="45" font-size="13">に答えが出る</text>

<!-- mod -->
<rect class="mod" x="90" y="120" width="185" height="56" rx="6" style="stroke:#8c959f"/>
<text class="mono t1" x="182" y="142" font-size="12" text-anchor="middle">turn.complete</text>
<text class="t1" x="182" y="164" font-size="12" text-anchor="middle">idがないのでWeb UIに返さない</text>
<rect class="mod" x="291" y="120" width="185" height="56" rx="6"/>
<text class="t1" x="383" y="142" font-size="12" text-anchor="middle">依頼を今の会話に入れる</text>
<text class="mono t1" x="383" y="164" font-size="11" text-anchor="middle">/pr-review:answer {…}</text>
<rect class="mod" x="492" y="120" width="185" height="56" rx="6"/>
<text class="mono t1" x="584" y="142" font-size="12" text-anchor="middle">turn.start</text>
<text class="t1" x="584" y="164" font-size="12" text-anchor="middle">文にt1がある → t1のターン</text>
<rect class="mod" x="693" y="120" width="185" height="56" rx="6"/>
<text class="mono t1" x="785" y="142" font-size="12" text-anchor="middle">turn.complete</text>
<text class="t1" x="785" y="164" font-size="12" text-anchor="middle">t1のターンの答えをt1へ</text>

<!-- ターン -->
<rect class="human" x="90" y="240" width="300" height="50" rx="6"/>
<text class="t1" x="240" y="262" font-size="13" text-anchor="middle">人がターミナルで頼んだ作業のターン</text>
<text class="t2" x="240" y="280" font-size="11" text-anchor="middle">Web UIの依頼はこのターンが終わるまで待つ</text>
<rect class="turn" x="410" y="240" width="420" height="50" rx="6"/>
<text class="t1" x="620" y="262" font-size="13" text-anchor="middle">Web UIの依頼のターン</text>
<text class="mono t2" x="620" y="280" font-size="11" text-anchor="middle">/pr-review:answer {"id":"t1", …}</text>

<!-- 行き：Web UI → mod → 今の会話 -->
<line class="ar" x1="250" y1="60" x2="340" y2="120" marker-end="url(#t1)"/>
<text class="t2" x="312" y="92" font-size="12">依頼にidを入れて送る</text>
<line class="ar" x1="430" y1="176" x2="455" y2="240" marker-end="url(#t1)"/>
<!-- ターンの始まりと終わり -->
<line class="ar" x1="530" y1="240" x2="560" y2="176" marker-end="url(#t1)"/>
<line class="ar" x1="815" y1="240" x2="795" y2="176" marker-end="url(#t1)"/>
<line class="no" x1="300" y1="240" x2="210" y2="176" marker-end="url(#t3)"/>
<!-- 帰り：mod → Web UI -->
<line class="back" x1="760" y1="120" x2="730" y2="60" marker-end="url(#t2)"/>

<text class="t2" x="880" y="318" font-size="11" text-anchor="end">サーバーは省略</text>
</svg>
